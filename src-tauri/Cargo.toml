[package]
name = "canopy"
version = "0.4.0"
description = "Shelter for your smartest ideas"
authors = ["Scottie Ryan"]
edition = "2021"

[lib]
name = "canopy_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
keyring = "2"
bollard = "0.16"          # Docker API client (for OrbStack)
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0.103"
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
notify = "6"                  # FSEvents file watcher (iMessage bridge)
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }  # WebSocket (Slack Socket Mode)
futures-util = "0.3"          # Stream/Sink traits for WebSocket
url = "2"                     # URL parsing (Slack OAuth)
urlencoding = "2"             # URL-encode OAuth params
open = "5"                    # Open browser for OAuth
lazy_static = "1"             # Global state (Slack listener)
base64 = "0.22.1"
png = "0.17"
async-trait = "0.1.89"
btleplug = "0.11"
hex = "0.4"
mime_guess = "2.0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
scraper = "0.20"      # HTML parsing for fetch_page title/link extraction
html2text = "0.12"    # HTML -> readable text for fetch_page / research
pbkdf2 = "0.12"       # Tier 4: derive the Chrome "Safe Storage" cookie-encryption key
sha1 = "0.10"         # Tier 4: PBKDF2-HMAC-SHA1, per Chromium's macOS os_crypt
aes = "0.8"           # Tier 4: AES-128-CBC cookie value decryption
cbc = "0.1"           # Tier 4: CBC mode + PKCS7 padding for the above
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Follow Me screen capture (Phase 1) — ScreenCaptureKit bridge, macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-screen-capture-kit = { version = "0.3", features = ["SCShareableContent", "SCScreenshotManager", "SCStream", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSError"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = { version = "0.3", features = ["CGImageDestination"] }
block2 = "0.6"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio-test = "0.4"
mockall = "0.15"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# TEMP diagnostic (2026-08-06): was `true`. Flipped off to get a symbolicated
# crash report for GitHub issue #17 (SIGABRT on tokio-rt-worker at launch) —
# `strip = true` was hiding the panic site entirely from atos. Revert to
# `true` once #17 is diagnosed/fixed; don't ship an unstripped release build.
strip = false

[features]
default = []
updater = ["tauri-plugin-updater"]
